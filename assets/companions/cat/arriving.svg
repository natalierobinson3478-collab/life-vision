<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- cat, arriving: walking in from the left, tail up, point tip flicked — mid-stride. -->
  <defs>
    <filter id="rough-cat-arriving" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-cat-arriving)">

    <path d="M18 80 L86 80" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M30 62 C38 55 56 54 64 58 C70 61 72 66 70 70" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M32 62 C30 67 30 72 32 76" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M36 74 L34 80 M46 76 L48 80 M58 74 L56 80 M66 70 L69 80" stroke="#3a3626" stroke-width="1.6" stroke-linecap="round"/>
    <g class="c-head">
      <path d="M62 58 C60 49 65 43 72 43.5 C79 44 82 51 79.5 58" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path class="c-ear" d="M63.5 48.5 L60.5 39 L68 43" stroke="#3a3626" stroke-width="1.6" fill="#5a4a3a" stroke-linejoin="round"/>
      <path class="c-ear-far" d="M77 46.5 L81 38 L73.5 42" stroke="#3a3626" stroke-width="1.6" fill="#5a4a3a" stroke-linejoin="round"/>
      <g class="c-eyes"><path d="M72 52 l3 0 M78 52.5 l2.5 0" stroke="#3a3626" stroke-width="1.6" stroke-linecap="round"/></g>
      <path d="M66 56 C63.5 56 62 57.5 62 59.5" stroke="#5a4a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>
    <path d="M30 62 C24 58 19 51 22 44 C24 39.5 29 41 28 46" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path class="c-tail-tip" d="M28 46 C27 41.5 30 38 34 39" stroke="#5a4a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M42 58 c-3 1 -4 3.5 -4 6" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".55"/>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="64" cy="56" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
