<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- moth, idle: resting on the page edge, wings held open and slightly
       uneven — cream fills, a faint vein and one ring spot per wing, a
       short furred body, two curled antennae. -->
  <defs>
    <filter id="rough-moth" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-moth)">
    <!-- the page edge it rests on -->
    <path d="M18 70 L82 70" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".5"/>
    <!-- body, short and furred -->
    <path d="M50 69 C50 62 48.5 56 50 50.5" stroke="#3a3626" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M48.5 60 l3 .5 M48.5 64 l3 .5" stroke="#3a3626" stroke-width=".9" stroke-linecap="round" opacity=".5"/>
    <!-- wings, cream, the left held a touch lower -->
    <path class="c-wing-l" d="M50 57.5 C40 49.5 27.5 49.5 21.5 58 C27.5 66 40 68 50 63.5Z" stroke="#3a3626" stroke-width="1.4" fill="#efe6c9" fill-opacity=".9"/>
    <path class="c-wing-r" d="M50 56.5 C60 49 72.5 49.5 78.5 57.5 C72.5 65.5 60 67.5 50 63Z" stroke="#3a3626" stroke-width="1.4" fill="#efe6c9" fill-opacity=".9"/>
    <!-- one vein each, not matching -->
    <path d="M29.5 57.5 c4.5 2 9 2.5 13 1.5 M58.5 58 c4.5 1.5 9 1.5 12.5 -.5" stroke="#3a3626" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".55"/>
    <!-- ring spots -->
    <circle cx="36" cy="59.5" r="2" stroke="#3a3626" stroke-width="1" fill="none"/>
    <circle cx="64.5" cy="59" r="2" stroke="#3a3626" stroke-width="1" fill="none"/>
    <!-- antennae, curled outward -->
    <g class="c-ant"><path d="M48.5 50.5 L44.5 42.5 M51.5 50.5 L55.5 42.5" stroke="#3a3626" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M44.5 42.5 c-2 -1 -3 -3 -2 -5 M55.5 42.5 c2 -1 3 -3 2 -5" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round"/></g>
  </g>
  <!-- item 98: where speech leaves the face; scraps and bubbles anchor here -->
  <circle class="c-mouth" cx="50" cy="49.5" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
