<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- moth, arriving: in flight above the line, wings up in a V. -->
  <defs>
    <filter id="rough-moth-arriving" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-moth-arriving)">

    <path d="M18 76 L82 76" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M50 60 C50 53 48.5 48 50 43" stroke="#3a3626" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <g class="c-wing-l"><path d="M49.5 50 C42 40 32 35.5 24 38.5 C27 47 36 53 47 54.5Z" stroke="#3a3626" stroke-width="1.4" fill="#efe6c9" fill-opacity=".9"/></g>
    <g class="c-wing-r"><path d="M50.5 49.5 C57.5 39 67.5 34.5 76 37.5 C73 46.5 64 52.5 53 54Z" stroke="#3a3626" stroke-width="1.4" fill="#efe6c9" fill-opacity=".9"/></g>
    <circle cx="38" cy="45" r="1.8" stroke="#3a3626" stroke-width="1" fill="none"/>
    <circle cx="62.5" cy="44.5" r="1.8" stroke="#3a3626" stroke-width="1" fill="none"/>
    <g class="c-ant"><path d="M48.5 43 L45 36 M51.5 43 L55 36 M45 36 c-2 -1 -3 -3 -2 -5 M55 36 c2 -1 3 -3 2 -5" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round"/></g>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="50" cy="34" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
