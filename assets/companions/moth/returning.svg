<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- moth, returning: still, wings closed flat along the line — asleep. -->
  <defs>
    <filter id="rough-moth-returning" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-moth-returning)">

    <path d="M18 68 L82 68" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M46 67 C48 62 52 58.5 57 57" stroke="#3a3626" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <g class="c-wing-l"><path d="M46 64.5 C50 57 57 52.5 65 52.5 C63 60 56.5 65.5 48.5 67Z" stroke="#3a3626" stroke-width="1.4" fill="#efe6c9" fill-opacity=".9"/></g>
    <g class="c-wing-r"><path d="M48 66 C52.5 60 59.5 56.5 67 57 C64 63.5 57 67.5 49.5 67.5Z" stroke="#3a3626" stroke-width="1.3" fill="#efe6c9" fill-opacity=".7"/></g>
    <circle cx="57" cy="59.5" r="1.8" stroke="#3a3626" stroke-width="1" fill="none"/>
    <g class="c-ant"><path d="M57 57 L54.5 52.5 M59.5 56 L58.5 51.5 M54.5 52.5 c-2 0 -3 -1 -3.5 -2.5 M58.5 51.5 c1.5 -.5 2.5 -1.5 2.5 -3" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round"/></g>
    <path d="M66 44 c3 -3 6 0 3 3" stroke="#3a3626" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".45"/>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="50" cy="44" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
