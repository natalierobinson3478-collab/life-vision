<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- moth, idle2: wings folded closed on the edge, a narrow tent. -->
  <defs>
    <filter id="rough-moth-idle2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-moth-idle2)">

    <path d="M18 72 L82 72" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M50 71 C50 64 49 58 50 52.5" stroke="#3a3626" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <g class="c-wing-l"><path d="M49.5 66 C45.5 58 45 50 48.5 44 C51 50 51 58 50 66Z" stroke="#3a3626" stroke-width="1.4" fill="#efe6c9" fill-opacity=".9"/></g>
    <g class="c-wing-r"><path d="M50.5 66 C54.5 58.5 55.5 51 52.5 44.5 C50 50.5 49.8 58 50.5 66Z" stroke="#3a3626" stroke-width="1.3" fill="#efe6c9" fill-opacity=".75"/></g>
    <g class="c-ant"><path d="M49 52.5 L45.5 45.5 M51 52.5 L54.5 45.5 M45.5 45.5 c-2 -1 -3 -3 -2 -5 M54.5 45.5 c2 -1 3 -3 2 -5" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round"/></g>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="50" cy="53" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
