<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- sparrow, returning: asleep — head tucked back under the wing. -->
  <defs>
    <filter id="rough-sparrow-returning" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-sparrow-returning)">

    <path d="M14 74 L86 74" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M33 71 C28 60 35 49 49 47.5 C62 46 71 53 69 63 C67.5 70.5 59 74.5 49 74" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M62 52 C58 47 51 46.5 47 50 C44 53 44.5 58 48 60.5" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g class="c-wing"><path d="M44 56 C50 51 60 51 65 57 C60 64 50 65 44 60Z" stroke="#3a3626" stroke-width="1.4" fill="#efe6c9" fill-opacity=".9"/></g>
    <path d="M50 58 c1 1 2 1 3 0" stroke="#3a3626" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M33 71 C28 72.5 24.5 71 22.5 68" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M70 42 c3 -3 6 0 3 3" stroke="#3a3626" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".45"/>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="46" cy="55" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
