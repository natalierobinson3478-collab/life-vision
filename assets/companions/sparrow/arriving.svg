<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- sparrow, arriving: landing — wings open, feet reaching for the line. -->
  <defs>
    <filter id="rough-sparrow-arriving" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-sparrow-arriving)">

    <path d="M14 78 L86 78" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M38 62 C34 53 40 44 51 42.5 C61 41 69 47 67.5 56 C66.5 63 59 67 51.5 66" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M51 42.5 C49.5 35 55 30 62 32 C68 34 68 41 63.5 44.5" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M64.5 36.5 L72 38.5 L64.5 40.5" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" stroke-linejoin="round"/>
    <circle cx="59.5" cy="36.5" r="1.5" fill="#3a3626"/>
    <g class="c-wing"><path d="M44 52 C34 44 24 42 16 46 C22 54 32 58 42 58" stroke="#3a3626" stroke-width="1.4" fill="#efe6c9" fill-opacity=".85"/></g>
    <path d="M40 62 C35 65 31 65 28 63" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M50 66 L48 74 M56 65 L56 74" stroke="#3a3626" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M45 75.5 L51 74.5 M53 75 L59.5 74.5" stroke="#3a3626" stroke-width="1.4" stroke-linecap="round"/>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="65" cy="39" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
