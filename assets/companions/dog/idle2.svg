    <path d="M30 80 L48 80 M34 74 C37 77 42 78.5 47 78" stroke="#3a3626" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g class="c-tail"><path d="M55 80 C62 79 68 76 71 72" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="68" cy="58" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
