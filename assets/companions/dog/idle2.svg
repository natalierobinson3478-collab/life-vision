      <path d="M58 61 C54 51 59 42 68 42 C76.5 42 79.5 51 75 60" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path class="c-ear" d="M59 47 C54 49 51.5 55 54 60" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" fill-opacity=".5" stroke-linecap="round"/>
      <path class="c-ear-far" d="M75.5 47.5 C80 50 81 55.5 78 60" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" fill-opacity=".5" stroke-linecap="round"/>
      <g class="c-eyes"><circle cx="64" cy="51.5" r="1.6" fill="#3a3626"/><circle cx="71" cy="51.5" r="1.6" fill="#3a3626"/></g>
      <path d="M66.5 55.5 C65 55.5 64.3 56.5 64.3 57.7 C66 58.5 69 58.5 70.5 57.7 C70.5 56.5 69.7 55.5 68.3 55.5Z" fill="#3a3626"/>
