<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- dog, returning: asleep on its side, legs loose. -->
  <defs>
    <filter id="rough-dog-returning" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-dog-returning)">

    <path d="M14 80 L86 80" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M24 78 C20 70 26 62 40 61 L58 62 C67 64 70 71 67 76.5 C65 79.5 60 80 54 80" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g class="c-head">
      <path d="M26 72 C22 66 25 59 33 58.5 C40 58 43.5 64 41 70.5" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path class="c-ear" d="M32 60 C27.5 61 25.5 65 27 69" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" fill-opacity=".5" stroke-linecap="round"/>
      <g class="c-eyes"><path d="M32 66 c1 1 2 1 3 0 M37 66 c1 1 2 1 3 0" stroke="#3a3626" stroke-width="1.4" fill="none" stroke-linecap="round"/></g>
    </g>
    <path d="M46 80 L46 73 M54 80 L55 74 M62 80 L64 75" stroke="#3a3626" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
    <g class="c-tail"><path d="M67 76.5 C73 76 78 73 80 69" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>
    <path d="M50 46 c3 -3 6 0 3 3 M57 38 c3 -3 6 0 3 3" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".45"/>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="28" cy="69" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
