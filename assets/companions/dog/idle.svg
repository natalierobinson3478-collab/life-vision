<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- dog, idle: sitting square, ears down, the only companion that looks at
       you — two dot eyes, an ink nose, a small open mouth. Clay ear fills.
       The tail rests out to the side, mid-thump-ready. -->
  <defs>
    <filter id="rough-dog" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-dog)">
    <!-- ground -->
    <path d="M25 84 L75 84" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".5"/>
    <!-- body: sitting, a little lopsided -->
    <path d="M32 84 C28 68 34 56 46 52 C56 48 66 52 70 62 C74 71.5 70.5 80 66.5 84" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- head, facing you -->
    <g class="c-head">
    <path d="M46 52 C42 40 48 31.5 58 31.5 C68 31.5 72 42 66 52" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- floppy ears, clay -->
    <path class="c-ear" d="M46 37.5 C40 39.5 36 47.5 38.5 54" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" fill-opacity=".5" stroke-linecap="round"/>
    <path class="c-ear-far" d="M68 37.5 C74 40 76 48 71.5 54" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" fill-opacity=".5" stroke-linecap="round"/>
    <!-- the eyes that look at you -->
    <g class="c-eyes"><circle cx="53.5" cy="42.5" r="1.6" fill="#3a3626"/>
    <circle cx="62" cy="42" r="1.6" fill="#3a3626"/></g>
    <!-- nose and open mouth -->
    <path d="M56.5 47 C55 47 54 48 54 49.5 C56 50.5 60 50.5 61.5 49.5 C61.5 48 60.5 47 58.5 47Z" fill="#3a3626"/>
    <path d="M58 50 L58 53 M55 54 c2 2 4 2 6 0" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
    <!-- front legs -->
    <path d="M44 68 C42.5 73 42.5 79 44 84 M56 68 C57.5 73 57.5 79 56.5 84" stroke="#3a3626" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/>
    <!-- chest fur breaks -->
    <path d="M48 60 c-2 1 -3 3 -2.5 5" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".5"/>
    <!-- tail resting out to the side -->
    <path class="c-tail" d="M66.5 84 C76 82 83.5 74.5 86 66.5" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- item 98: where speech leaves the face; scraps and bubbles anchor here -->
  <circle class="c-mouth" cx="58" cy="50" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
