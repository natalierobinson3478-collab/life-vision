<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- fox, returning: curled to a full circle, nose under the brush tip. -->
  <defs>
    <filter id="rough-fox-returning" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-fox-returning)">

    <path d="M20 80 L80 80" stroke="#3a3626" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M24 74 C21 62 31 53 48 53 C65 53 76 61 74 70 C72.5 77 63 80 54 80" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g class="c-head">
      <path d="M33 67 C31.5 60 38 55.5 46 57.5 C51.5 59.5 53.5 65 50 68.5" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path class="c-ear" d="M36.5 59 L34 51 L41.5 56.5" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" fill-opacity=".65" stroke-linejoin="round"/>
      <path class="c-ear-far" d="M45.5 57.5 L49.5 50.5 L42.5 55.5" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" fill-opacity=".65" stroke-linejoin="round"/>
      <path d="M39.5 63 c1 1 2 1 3 0" stroke="#3a3626" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <g class="c-tail"><path d="M54 80 C40 82 29 77 32 70.5 C34 66.5 42 67 44 71" stroke="#3a3626" stroke-width="1.8" fill="#a9876a" fill-opacity=".55" stroke-linecap="round"/>
    <path d="M44 71 C46.5 69 50 69.5 51 72" stroke="#3a3626" stroke-width="1.6" fill="#efe6c9" stroke-linecap="round"/></g>
    <path d="M62 40 c3 -3 6 0 3 3" stroke="#3a3626" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".45"/>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="35" cy="65" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
