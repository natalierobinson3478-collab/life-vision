<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- plant, arriving: just potted — a short stem, two young leaves. -->
  <defs>
    <filter id="rough-plant-arriving" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-plant-arriving)">

    <path d="M34 62 L66 62 L62.5 88 L38 88 Z" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" fill-opacity=".55" stroke-linejoin="round"/>
    <path d="M31.5 62 L68.5 62" stroke="#3a3626" stroke-width="1.6" stroke-linecap="round"/>
    <path class="c-stem" d="M50 62 C50 54 49.5 48 51 42" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path class="c-leaf" d="M50 54 C43 54 38.5 49.5 38.5 44.5 C44.5 44.5 49 48 50 54Z" stroke="#3a3626" stroke-width="1.4" fill="#6f7f5c" fill-opacity=".7"/>
    <path class="c-leaf2" d="M51 42 C46 42 43 38.5 43 34.5 C48 34.5 51 37.5 51 42Z" stroke="#3a3626" stroke-width="1.4" fill="#6f7f5c" fill-opacity=".7"/>

  </g>
  <!-- G2d: the head anchor — speech places from here -->
  <circle class="c-mouth" cx="50" cy="34" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
