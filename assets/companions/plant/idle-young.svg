<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- plant, idle-young: a seedling: the same pot, one loop of stem, two cotyledons. -->
  <defs>
    <filter id="rough-plant-idle-young" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="3.4" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough-plant-idle-young)">

    <path d="M34 62 L66 62 L62.5 88 L38 88 Z" stroke="#3a3626" stroke-width="1.6" fill="#a9876a" fill-opacity=".55" stroke-linejoin="round"/>
    <path d="M31.5 62 L68.5 62" stroke="#3a3626" stroke-width="1.6" stroke-linecap="round"/>
    <path class="c-stem" d="M50 62 C50 57 49.5 53 50.5 49" stroke="#3a3626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path class="c-leaf" d="M50 53 C45 53 42 50 42 46.5 C46.5 46.5 49.5 49 50 53Z" stroke="#3a3626" stroke-width="1.4" fill="#6f7f5c" fill-opacity=".7"/>
    <path class="c-leaf2" d="M50.5 49 C55 48.5 57.5 45.5 57 42 C52.5 42.5 50.5 45.5 50.5 49Z" stroke="#3a3626" stroke-width="1.4" fill="#6f7f5c" fill-opacity=".7"/>

  </g>
  <!-- item 98: where speech leaves the face; scraps and bubbles anchor here -->
  <circle class="c-mouth" cx="54" cy="43.5" r="0.1" fill="none" stroke="none" aria-hidden="true"/>
</svg>
